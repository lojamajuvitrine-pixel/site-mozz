name: Sync completo do Bling (fotos, marca, descrição, preço, estoque)

# Diferente do sync-estoque.yml (roda sozinho a cada 5 minutos, so' preco/estoque), esse aqui
# roda so' quando VOCE clica em "Run workflow" na aba Actions do GitHub - use sempre que
# cadastrar foto nova, produto novo, ou mudar nome/marca/descricao no Bling e quiser que
# apareca no site sem esperar. Demora mais que o sync rapido (baixa e otimiza toda foto nova).
on:
  workflow_dispatch: {}

# Evita que esse sync rode ao mesmo tempo que o sync-estoque.yml (roda sozinho a cada 5min) ou
# outra execucao dele mesmo - os dois terminam com um "git push" pra main, e rodando junto um
# empurra o chao debaixo do outro (bug reportado pelo Brunno em 29/08/2026: o push do sync
# completo foi rejeitado porque a main tinha andado enquanto ele ainda baixava as fotos novas).
# Mesmo grupo de nome no sync-estoque.yml -> o GitHub enfileira em vez de rodar em paralelo.
concurrency:
  group: bling-sync-git-push
  cancel-in-progress: false

jobs:
  sync-bling-completo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Rodar sync completo (fotos, marca, descrição, preço, estoque)
        env:
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_REFRESH_TOKEN: ${{ secrets.BLING_REFRESH_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cat > .env.local <<EOF
          BLING_CLIENT_ID=$BLING_CLIENT_ID
          BLING_CLIENT_SECRET=$BLING_CLIENT_SECRET
          BLING_REFRESH_TOKEN=$BLING_REFRESH_TOKEN
          NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
          SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
          EOF
          npm run sync:bling

      # Mesmo cuidado do sync-estoque.yml - o Bling troca o refresh_token a cada uso.
      - name: Atualizar BLING_REFRESH_TOKEN no GitHub, se rotacionou
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
        run: |
          NOVO_TOKEN=$(grep '^BLING_REFRESH_TOKEN=' .env.local | cut -d '=' -f2-)
          if [ -n "$NOVO_TOKEN" ] && [ "$NOVO_TOKEN" != "${{ secrets.BLING_REFRESH_TOKEN }}" ]; then
            echo "Refresh token rotacionou - atualizando secret do repositorio..."
            gh secret set BLING_REFRESH_TOKEN --body "$NOVO_TOKEN" --repo "${{ github.repository }}"
          else
            echo "Refresh token nao mudou - nada a atualizar."
          fi

      - name: Commit e push, se algo mudou
        run: |
          git config user.name "mozz-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/produtos.json public/produtos
          if git diff --cached --quiet; then
            echo "Nenhuma mudanca de catalogo/foto nesse ciclo."
            exit 0
          fi
          git commit -m "sync completo: atualiza fotos/marca/descricao/preco/estoque via Bling"

          # Esse job pode demorar minutos baixando/otimizando foto nova - se alguem editou
          # algo direto pelo site do GitHub nesse meio tempo (ou o concurrency acima nao
          # bastou), o push simples e' rejeitado ("fetch first"), e o commit fica preso so'
          # aqui no runner sem publicar nada (bug reportado pelo Brunno em 29/08/2026).
          # Corrigido com um busca-reaplica-tenta-de-novo, ate' 5 vezes.
          for tentativa in 1 2 3 4 5; do
            if git push; then
              echo "Push ok."
              exit 0
            fi
            echo "Push rejeitado (tentativa $tentativa/5) - buscando o que mudou na main e reaplicando esse commit por cima..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase deu conflito de verdade (bem raro - normalmente so' mexe em data/produtos.json e public/produtos). Abortando; rode o sync completo de novo."
              git rebase --abort
              exit 1
            fi
            sleep 5
          done
          echo "Nao consegui publicar depois de 5 tentativas - verifique manualmente."
          exit 1
